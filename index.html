<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Portafolio personal y tarjeta de presentación de Carolina Torres - Product designer, IA Entusiast, Docente.">
    <title>naxitopop - Portafolio Personal</title>

    <!-- Google Fonts: Outfit (300, 400, 500, 600, 700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- TARJETA DE PRESENTACIÓN PRINCIPAL -->
    <main class="card" id="profile-card">

        <!-- Menú de Navegación Superior -->
        <nav class="nav" aria-label="Navegación principal">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="#inicio" class="nav-link active" id="nav-inicio">Inicio</a>
                </li>
                <li class="nav-item">
                    <a href="#proyectos" class="nav-link" id="nav-proyectos">Proyectos</a>
                </li>
                <li class="nav-item">
                    <a href="#contacto" class="nav-link" id="nav-contacto">Contacto</a>
                </li>
            </ul>
        </nav>

        <!-- Contenedor del Avatar Circular -->
        <div class="avatar-container">
            <img src="img/avatar.jpg" alt="Fotografía de perfil de Carolina Torres" class="avatar">
        </div>

        <!-- Encabezado de Perfil: Nombre y Especialidad -->
        <header class="profile-header">
            <h1 class="profile-name">Naxito pop</h1>
            <p class="profile-subtitle">la fixa de la IA</p>
        </header>

        <!-- Línea Decorativa Divisoria -->
        <hr class="separator">

        <!-- Párrafo de Biografía Personal -->
        <section class="bio-section">
            <p class="bio-text">
                Me apasiona el arte, el diseño y la tecnologia, y el dinero

            </p>
        </section>

        <!-- Enlaces a Redes Sociales y Contacto -->
        <nav class="social-links" aria-label="Enlaces de redes sociales y contacto">
            <!-- Instagram -->
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="btn-social"
                id="btn-instagram">
                <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                <span class="btn-text">Instagram</span>
            </a>

            <!-- LinkedIn -->
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="btn-social"
                id="btn-linkedin">
                <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path
                        d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.46 1.46 0 1 0 0-2.92 1.46 1.46 0 0 0 0 2.92m1.37 9.74V10.13H5.09v8.37h2.74z" />
                </svg>
                <span class="btn-text">LinkedIn</span>
            </a>

            <!-- WhatsApp -->
            <a href="https://whatsapp.com" target="_blank" rel="noopener noreferrer" class="btn-social"
                id="btn-whatsapp">
                <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path
                        d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.03-1.24-.75-.67-1.26-1.5-1.41-1.75-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1s.9 2.44 1.03 2.61c.13.17 1.77 2.71 4.29 3.8.6.26 1.07.41 1.44.53.61.19 1.16.17 1.6.1.49-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.07-.11-.23-.17-.48-.29z" />
                </svg>
                <span class="btn-text">WhatsApp</span>
            </a>
        </nav>

    </main>

</body>

</html>
